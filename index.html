<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>사과게임</title>
  <style>
    :root {
      --bg: #fff4e6;
      --leaf: #3d7a3d;
      --leaf-dark: #2c5c2c;
      --wood: #c4784a;
      --wood-dark: #8b4a2b;
      --apple-red: #e23a3a;
      --apple-dark: #b81f2a;
      --ink: #3a2418;
      --paper: #fffaf3;
      --shadow: rgba(90, 40, 20, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    html, body {
      height: 100%;
      height: 100dvh;
      background:
        radial-gradient(ellipse at 20% 0%, #ffe8c4 0%, transparent 50%),
        radial-gradient(ellipse at 90% 20%, #ffd6c8 0%, transparent 40%),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 20px;
    }

    header {
      width: min(1100px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .title h1 {
      font-size: clamp(22px, 3vw, 32px);
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .badge {
      background: #fff;
      border: 2px solid #f0c9a0;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
      box-shadow: 0 4px 0 #e8b07a;
    }

    .hud {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 92px;
      background: var(--paper);
      border: 2px solid #f0c9a0;
      border-radius: 14px;
      padding: 8px 12px;
      box-shadow: 0 5px 0 #e8b07a;
    }

    .stat span {
      display: block;
      font-size: 11px;
      color: #8a5a3a;
      font-weight: 700;
    }

    .stat strong {
      font-size: 22px;
      line-height: 1.1;
    }

    .board-wrap {
      position: relative;
      width: min(1100px, 100%, calc((100dvh - 140px) * var(--cols, 17) / var(--rows, 10)));
      aspect-ratio: var(--cols, 17) / calc(var(--rows, 10) + 0.35);
      flex: 0 1 auto;
      min-height: 0;
      background: linear-gradient(#f7d7a8, #efc48a);
      border: 6px solid var(--wood);
      border-radius: 22px;
      box-shadow:
        inset 0 0 0 4px #fbe7c4,
        0 16px 0 var(--wood-dark),
        0 28px 40px var(--shadow);
      overflow: hidden;
    }

    .board {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(var(--cols, 17), 1fr);
      grid-template-rows: repeat(var(--rows, 10), 1fr);
      gap: 4px;
      padding: 10px;
      touch-action: none;
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
    }

    .apple {
      position: relative;
      width: min(86%, 58px);
      aspect-ratio: 1;
      border-radius: 50% 50% 48% 48%;
      background:
        radial-gradient(circle at 32% 28%, #ff8a7a 0 14%, transparent 15%),
        radial-gradient(circle at 35% 30%, #ff6b5a, var(--apple-red) 62%, var(--apple-dark));
      box-shadow:
        inset -6px -8px 0 rgba(0, 0, 0, 0.08),
        0 6px 0 rgba(140, 20, 20, 0.25);
      display: grid;
      place-items: center;
      color: #fff8e8;
      font-weight: 800;
      font-size: clamp(14px, 2.1vw, 22px);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transform-origin: center;
    }

    .apple::before {
      content: "";
      position: absolute;
      top: -14%;
      width: 18%;
      height: 16%;
      background: var(--leaf);
      border-radius: 0 10px 2px 10px;
      transform: rotate(18deg);
      box-shadow: -0.35em 0.1em 0 -0.05em var(--leaf-dark);
    }

    .apple.gone {
      animation: pop 220ms ease-out forwards;
    }

    .cell.empty .apple { display: none; }
    .cell.picked .apple {
      transform: scale(1.08);
      box-shadow:
        inset -6px -8px 0 rgba(0, 0, 0, 0.08),
        0 0 0 3px #fff8c8,
        0 6px 0 rgba(140, 20, 20, 0.25);
    }

    .selection {
      position: absolute;
      border: 3px solid rgba(80, 150, 255, 0.9);
      background: rgba(90, 170, 255, 0.18);
      border-radius: 10px;
      pointer-events: none;
      display: none;
      z-index: 3;
    }

    .selection.good { border-color: #2f9e44; background: rgba(47, 158, 68, 0.2); }
    .selection.bad { border-color: #c92a2a; background: rgba(201, 42, 42, 0.16); }

    .sum-chip {
      position: absolute;
      top: -18px;
      right: -8px;
      background: #222;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .overlay, .howto {
      position: fixed;
      inset: 0;
      background: rgba(48, 24, 12, 0.42);
      display: grid;
      place-items: center;
      z-index: 5;
      padding: 20px;
    }

    .card {
      width: min(460px, 100%);
      background: var(--paper);
      border: 4px solid #f0c9a0;
      border-radius: 22px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 16px 0 #d9a36a;
    }

    .card h2 { font-size: 30px; margin-bottom: 8px; }
    .card p { color: #7a4d32; line-height: 1.5; margin-bottom: 18px; }

    button {
      appearance: none;
      border: 0;
      background: var(--apple-red);
      color: white;
      font-weight: 800;
      font-size: 18px;
      padding: 12px 22px;
      border-radius: 14px;
      box-shadow: 0 6px 0 var(--apple-dark);
      cursor: pointer;
    }

    button:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--apple-dark); }

    .ghost {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 6px 0 #e0c3a0;
      border: 2px solid #f0c9a0;
      margin-left: 8px;
    }

    .float {
      position: absolute;
      z-index: 4;
      font-weight: 900;
      color: #2b8a3e;
      pointer-events: none;
      animation: float 700ms ease-out forwards;
    }

    @keyframes pop {
      to { transform: scale(0); opacity: 0; }
    }

    @keyframes float {
      to { transform: translateY(-28px); opacity: 0; }
    }

    @media (max-width: 720px) {
      body { padding: 8px; overflow: hidden; }
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        margin-bottom: 8px;
      }
      .title { justify-content: flex-start; }
      .hud { justify-content: stretch; }
      .stat { min-width: 0; flex: 1; padding: 8px 8px; }
      .stat span { font-size: 12px; }
      .stat strong { font-size: 20px; }
      .board { gap: 5px; padding: 8px; }
      .apple {
        width: 94%;
        max-width: none;
        font-size: clamp(18px, 5vw, 26px);
      }
      .board-wrap {
        width: 100%;
        flex: 1 1 auto;
        height: auto;
        max-height: none;
        border-width: 4px;
        border-radius: 16px;
        box-shadow:
          inset 0 0 0 3px #fbe7c4,
          0 10px 0 var(--wood-dark),
          0 16px 24px var(--shadow);
      }
      .selection { border-width: 4px; }
      .sum-chip { top: -22px; font-size: 15px; padding: 5px 10px; }
      .card { padding: 22px 16px; }
      .card h2 { font-size: 24px; }
      button {
        min-height: 48px;
        min-width: 120px;
        font-size: 18px;
        padding: 14px 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <div class="badge">🍎</div>
      <h1>사과게임</h1>
    </div>
    <div class="hud">
      <div class="stat"><span>점수</span><strong id="score">0</strong></div>
      <div class="stat"><span>콤보</span><strong id="combo">0</strong></div>
      <div class="stat"><span>남은 시간</span><strong id="time">120</strong></div>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="selection" id="selection"><div class="sum-chip" id="sumChip">0</div></div>
    <div class="howto" id="howto">
      <div class="card">
        <h2>사과를 밀어서 고르세요</h2>
        <p>
          손가락이나 마우스로 직사각형을 그리세요. 숫자의 합이 <strong>정확히 10</strong>이면 사라집니다.<br />
          휴대폰에서는 사과가 더 크게 나오고, 칸 전체에 닿으면 선택됩니다.
        </p>
        <button id="startBtn">게임 시작</button>
      </div>
    </div>
    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2>시간 종료!</h2>
        <p id="result">점수 0점</p>
        <button id="retryBtn">다시 하기</button>
        <button class="ghost" id="helpBtn">설명 보기</button>
      </div>
    </div>
  </div>

  <script>
    const TIME = 120;

    const boardEl = document.getElementById("board");
    const wrapEl = boardEl.parentElement;
    const selectionEl = document.getElementById("selection");
    const sumChip = document.getElementById("sumChip");
    const scoreEl = document.getElementById("score");
    const comboEl = document.getElementById("combo");
    const timeEl = document.getElementById("time");
    const howtoEl = document.getElementById("howto");
    const overEl = document.getElementById("over");
    const resultEl = document.getElementById("result");

    let COLS = 17;
    let ROWS = 10;
    let cells = [];
    let score = 0;
    let combo = 0;
    let left = TIME;
    let timer = null;
    let playing = false;
    let drag = null;

    function boardSize() {
      const mobile = window.matchMedia("(max-width: 720px)").matches;
      const landscape = window.matchMedia("(orientation: landscape)").matches;
      if (mobile && landscape) return { cols: 10, rows: 7 };
      if (mobile) return { cols: 8, rows: 10 };
      return { cols: 17, rows: 10 };
    }

    function applyBoardSize() {
      const size = boardSize();
      COLS = size.cols;
      ROWS = size.rows;
      document.documentElement.style.setProperty("--cols", String(COLS));
      document.documentElement.style.setProperty("--rows", String(ROWS));
    }

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function makeBoard() {
      applyBoardSize();
      boardEl.innerHTML = "";
      cells = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          const apple = document.createElement("div");
          apple.className = "apple";
          const value = rand(1, 9);
          apple.textContent = value;
          cell.appendChild(apple);
          boardEl.appendChild(cell);
          cells.push({ r, c, value, el: cell, alive: true });
        }
      }
    }

    function cellAt(r, c) {
      return cells[r * COLS + c];
    }

    function resetGame() {
      score = 0;
      combo = 0;
      left = TIME;
      playing = true;
      scoreEl.textContent = "0";
      comboEl.textContent = "0";
      timeEl.textContent = String(TIME);
      howtoEl.hidden = true;
      overEl.hidden = true;
      makeBoard();
      clearInterval(timer);
      timer = setInterval(() => {
        left -= 1;
        timeEl.textContent = String(left);
        if (left <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      playing = false;
      clearInterval(timer);
      resultEl.textContent = `점수 ${score}점 · 최고 콤보 ${comboEl.dataset.best || combo}`;
      overEl.hidden = false;
    }

    function cellFromPoint(x, y) {
      let best = null;
      let bestDist = Infinity;
      for (const cell of cells) {
        const rect = cell.el.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          return cell;
        }
        const cx = (rect.left + rect.right) / 2;
        const cy = (rect.top + rect.bottom) / 2;
        const dist = (cx - x) ** 2 + (cy - y) ** 2;
        if (dist < bestDist) {
          bestDist = dist;
          best = cell;
        }
      }
      return best;
    }

    function rangeFromDrag() {
      const start = cellFromPoint(drag.x0, drag.y0);
      const end = cellFromPoint(drag.x1, drag.y1);
      if (!start || !end) return null;
      const r0 = Math.min(start.r, end.r);
      const r1 = Math.max(start.r, end.r);
      const c0 = Math.min(start.c, end.c);
      const c1 = Math.max(start.c, end.c);
      const wrap = wrapEl.getBoundingClientRect();
      const a = cellAt(r0, c0).el.getBoundingClientRect();
      const b = cellAt(r1, c1).el.getBoundingClientRect();
      return {
        r0,
        c0,
        r1,
        c1,
        left: Math.min(a.left, b.left) - wrap.left,
        top: Math.min(a.top, b.top) - wrap.top,
        width: Math.max(a.right, b.right) - Math.min(a.left, b.left),
        height: Math.max(a.bottom, b.bottom) - Math.min(a.top, b.top),
      };
    }

    function selectedCells(range) {
      const picked = [];
      for (let r = range.r0; r <= range.r1; r++) {
        for (let c = range.c0; c <= range.c1; c++) {
          const cell = cellAt(r, c);
          if (cell.alive) picked.push(cell);
        }
      }
      return picked;
    }

    function clearPicked() {
      cells.forEach((cell) => cell.el.classList.remove("picked"));
    }

    function updateSelection() {
      const range = rangeFromDrag();
      if (!range) return { picked: [], sum: 0, range: null };
      const picked = selectedCells(range);
      const sum = picked.reduce((acc, cell) => acc + cell.value, 0);
      clearPicked();
      picked.forEach((cell) => cell.el.classList.add("picked"));
      selectionEl.style.display = "block";
      selectionEl.style.left = range.left + "px";
      selectionEl.style.top = range.top + "px";
      selectionEl.style.width = range.width + "px";
      selectionEl.style.height = range.height + "px";
      selectionEl.className = "selection " + (sum === 10 && picked.length ? "good" : picked.length ? "bad" : "");
      sumChip.textContent = `합 ${sum}`;
      return { picked, sum, range };
    }

    function popApples(picked) {
      combo += 1;
      const best = Number(comboEl.dataset.best || 0);
      comboEl.dataset.best = String(Math.max(best, combo));
      comboEl.textContent = String(combo);
      const gain = picked.length * (combo > 1 ? combo : 1);
      score += gain;
      scoreEl.textContent = String(score);

      const first = picked[0].el.getBoundingClientRect();
      const boardRect = boardEl.getBoundingClientRect();
      const float = document.createElement("div");
      float.className = "float";
      float.textContent = `+${gain}`;
      float.style.left = first.left - boardRect.left + "px";
      float.style.top = first.top - boardRect.top + "px";
      boardEl.appendChild(float);
      setTimeout(() => float.remove(), 700);

      picked.forEach((cell) => {
        cell.alive = false;
        cell.el.classList.add("empty");
        cell.el.querySelector(".apple").classList.add("gone");
      });
    }

    function eventPoint(e) {
      if (e.touches && e.touches[0]) return e.touches[0];
      if (e.changedTouches && e.changedTouches[0]) return e.changedTouches[0];
      return e;
    }

    function onDown(e) {
      if (!playing) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      const point = eventPoint(e);
      drag = { x0: point.clientX, y0: point.clientY, x1: point.clientX, y1: point.clientY };
      if (e.pointerId != null && boardEl.setPointerCapture) {
        boardEl.setPointerCapture(e.pointerId);
      }
      updateSelection();
    }

    function onMove(e) {
      if (!drag || !playing) return;
      e.preventDefault();
      const point = eventPoint(e);
      drag.x1 = point.clientX;
      drag.y1 = point.clientY;
      updateSelection();
    }

    function onUp(e) {
      if (e) e.preventDefault();
      if (!drag || !playing) {
        drag = null;
        clearPicked();
        selectionEl.style.display = "none";
        return;
      }
      const { picked, sum } = updateSelection();
      if (sum === 10 && picked.length) popApples(picked);
      else combo = 0, comboEl.textContent = "0";
      drag = null;
      clearPicked();
      selectionEl.style.display = "none";
    }

    boardEl.addEventListener("pointerdown", onDown);
    boardEl.addEventListener("pointermove", onMove);
    boardEl.addEventListener("pointerup", onUp);
    boardEl.addEventListener("pointercancel", onUp);
    window.addEventListener("touchmove", (e) => {
      if (drag || playing) e.preventDefault();
    }, { passive: false });

    document.getElementById("startBtn").onclick = resetGame;
    document.getElementById("retryBtn").onclick = resetGame;
    document.getElementById("helpBtn").onclick = () => {
      overEl.hidden = true;
      howtoEl.hidden = false;
    };

    applyBoardSize();
    makeBoard();
    window.addEventListener("resize", () => {
      if (!playing) {
        applyBoardSize();
        makeBoard();
      }
    });
  </script>
</body>
</html>
